name: Package fix build

on:
  push:
    branches: [ "fix/**" ]

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore
        run: dotnet restore NapisyPL.sln

      - name: Build desktop projects
        run: dotnet build src/NapisyPL/NapisyPL.csproj -c Release --no-restore

      - name: Build Argos helper
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check `
            "ctranslate2>=4,<5" `
            "sentencepiece>=0.2,<0.3" `
            "sacremoses>=0.0.53,<0.2" `
            "subword-nmt>=0.3,<0.4" `
            pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --name SubFlow.ArgosHelper `
            --collect-all ctranslate2 `
            --collect-all sentencepiece `
            --collect-all sacremoses `
            --collect-all subword_nmt `
            tools/argos_helper.py

      - name: Smoke test Argos helper
        shell: pwsh
        run: |
          $output = '{"type":"shutdown"}' | & .\dist\SubFlow.ArgosHelper.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 0) { throw "Argos helper smoke test failed with exit code $exitCode" }

      - name: Build Bergamot helper
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "bergamot-translator"
          $build = Join-Path $env:RUNNER_TEMP "bergamot-build"
          & ./tools/offline-mt/build-bergamot-helper.ps1 `
            -SourceDirectory $source `
            -BuildDirectory $build `
            -OutputPath "dist/SubFlow.BergamotHelper.exe"

      - name: Smoke test Bergamot helper
        shell: pwsh
        run: |
          $output = '{"type":"shutdown"}' | & .\dist\SubFlow.BergamotHelper.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 0) { throw "Bergamot helper smoke test failed with exit code $exitCode" }

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/NapisyPL/NapisyPL.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts/win-x64
          Copy-Item dist/SubFlow.ArgosHelper.exe artifacts/win-x64/SubFlow.ArgosHelper.exe
          Copy-Item dist/SubFlow.BergamotHelper.exe artifacts/win-x64/SubFlow.BergamotHelper.exe
          if (-not (Test-Path artifacts/win-x64/SubFlow.ArgosHelper.exe)) { throw 'SubFlow.ArgosHelper.exe missing from Windows package.' }
          if (-not (Test-Path artifacts/win-x64/SubFlow.BergamotHelper.exe)) { throw 'SubFlow.BergamotHelper.exe missing from Windows package.' }

      - name: Smoke test desktop startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\artifacts\win-x64\NapisyPL.exe -PassThru
          Start-Sleep -Seconds 3
          $process.Refresh()
          if ($process.HasExited) {
            throw "SubFlow exited during startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SubFlow-win-x64-offline-mt-fix
          path: artifacts/win-x64/
          if-no-files-found: error
