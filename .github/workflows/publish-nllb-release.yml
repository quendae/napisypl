name: Publish Offline MT GPU Profiles Test Release

on:
  workflow_dispatch:
  push:
    branches:
      - feature/offline-mt-gpu-profiles
    paths:
      - '.github/workflows/publish-nllb-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified immediate question gender artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10344559811'
          EXPECTED_SHA256: '1e03730a8c9cf71332aa8f3b6faa7894dce4730b6b6e79ec783ddad3afdf81d5'
          ASSET_NAME: 'SubFlow-win-x64-immediate-question-gender-3687ccd.zip'
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$ASSET_NAME"
          echo "${EXPECTED_SHA256}  ${ASSET_NAME}" | sha256sum -c -

      - name: Upload asset to existing GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: subflow-offline-mt-gpu-profiles-008dd36
          ASSET_NAME: 'SubFlow-win-x64-immediate-question-gender-3687ccd.zip'
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
