name: Publish Offline MT GPU Profiles Test Release

on:
  workflow_dispatch:
  push:
    branches:
      - feature/offline-mt-gpu-profiles
    paths:
      - '.github/workflows/publish-nllb-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Enhanced gender safety artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10342333921'
          EXPECTED_SHA256: '39ebc30bc0d6c63a131a0cd932569e2da833d401de761d01198976c296b61fd3'
          ASSET_NAME: 'SubFlow-win-x64-enhanced-gender-safety-349074f.zip'
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$ASSET_NAME"
          echo "${EXPECTED_SHA256}  ${ASSET_NAME}" | sha256sum -c -

      - name: Upload asset to existing GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: subflow-offline-mt-gpu-profiles-008dd36
          ASSET_NAME: 'SubFlow-win-x64-enhanced-gender-safety-349074f.zip'
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
