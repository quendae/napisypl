name: Publish NLLB Test Release

on:
  workflow_dispatch:
  push:
    branches:
      - fix/offline-mt-first-run
    paths:
      - '.github/workflows/publish-nllb-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified NLLB artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10320299727'
          EXPECTED_SHA256: 'fc6600895b21d8dca13857fa1883ba6d14cc5f8ee9511fa2a772504b39129df8'
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o SubFlow-win-x64-nllb-test.zip
          echo "${EXPECTED_SHA256}  SubFlow-win-x64-nllb-test.zip" | sha256sum -c -

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: subflow-nllb-test-ad2c2df
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            SubFlow-win-x64-nllb-test.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target ad2c2df52373d2ed434a699ac3dc89c014deae1b \
            --title "SubFlow NLLB Windows x64 test" \
            --notes "Verified Windows x64 NLLB test build. CI real-model smoke: EN→PL translation passed, including a 66-segment batch. SHA-256: fc6600895b21d8dca13857fa1883ba6d14cc5f8ee9511fa2a772504b39129df8" \
            --prerelease
