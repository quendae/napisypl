name: Offline MT Diagnose

on:
  push:
    branches: [ "fix/offline-mt-first-run" ]
    paths:
      - ".github/workflows/offline-mt-diagnose.yml"
  workflow_dispatch:

jobs:
  inspect-models:
    runs-on: windows-latest
    steps:
      - name: Inspect OPUS Marian archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archivePath = Join-Path $env:RUNNER_TEMP 'opus-2021-02-19.zip'
          Invoke-WebRequest -Uri 'https://object.pouta.csc.fi/Tatoeba-MT-models/eng-pol/opus-2021-02-19.zip' -OutFile $archivePath
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            Write-Host "OPUS entries:"
            $zip.Entries | Sort-Object FullName | ForEach-Object { Write-Host ("{0}`t{1}" -f $_.FullName, $_.Length) }
          }
          finally { $zip.Dispose() }

      - name: Inspect Firefox EN to PL Remote Settings records
        shell: pwsh
        run: |
          $registry = Invoke-RestMethod -Uri 'https://firefox.settings.services.mozilla.com/v2/buckets/main/collections/translations-models-v2/changeset?_expected=0'
          $records = @($registry.changes | Where-Object {
            $_.sourceLanguage -eq 'en' -and $_.targetLanguage -eq 'pl' -and [string]::IsNullOrWhiteSpace($_.filter_expression)
          })
          if ($records.Count -eq 0) { throw 'No Firefox EN->PL records found.' }
          Write-Host "Firefox EN->PL records:"
          $records | Sort-Object architecture, version, fileType | ForEach-Object {
            Write-Host ("arch={0} version={1} type={2} name={3} decompressedSize={4} attachment={5}" -f $_.architecture,$_.version,$_.fileType,$_.name,$_.decompressedSize,$_.attachment.filename)
          }
