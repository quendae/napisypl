name: Offline MT Runtime

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "tools/offline-mt/**"
      - ".github/workflows/offline-mt-runtime.yml"
  pull_request:
    paths:
      - "tools/offline-mt/**"
      - ".github/workflows/offline-mt-runtime.yml"
  workflow_dispatch:

jobs:
  nllb-protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test NLLB helper protocol
        run: python -m unittest discover -s tools/offline-mt -p "test_nllb_protocol.py" -v

  bergamot-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build pinned Bergamot helper
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "bergamot-translator"
          $build = Join-Path $env:RUNNER_TEMP "bergamot-build"
          $helper = Join-Path $env:RUNNER_TEMP "SubFlow.BergamotHelper.exe"
          & ./tools/offline-mt/build-bergamot-helper.ps1 `
            -SourceDirectory $source `
            -BuildDirectory $build `
            -OutputPath $helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SUBFLOW_BERGAMOT_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test Bergamot helper protocol
        run: python -m unittest discover -s tools/offline-mt -p "test_bergamot_protocol.py" -v

      - name: Upload Bergamot helper
        uses: actions/upload-artifact@v4
        with:
          name: SubFlow-BergamotHelper-win-x64
          path: ${{ env.SUBFLOW_BERGAMOT_HELPER }}
          if-no-files-found: error
