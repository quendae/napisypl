name: Offline MT Runtime

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "tools/offline-mt/**"
      - ".github/workflows/offline-mt-runtime.yml"
  pull_request:
    paths:
      - "tools/offline-mt/**"
      - ".github/workflows/offline-mt-runtime.yml"
  workflow_dispatch:

jobs:
  bergamot-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test Bergamot helper protocol
        run: python -m unittest tools.offline-mt.test_bergamot_protocol -v
