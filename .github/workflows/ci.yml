name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore
        run: dotnet restore NapisyPL.sln

      - name: Test
        run: dotnet test NapisyPL.sln -c Release --no-restore

      - name: Build Argos helper
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "ctranslate2>=4,<5" "sentencepiece>=0.2,<0.3" pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --name SubFlow.ArgosHelper `
            --collect-all ctranslate2 `
            --collect-all sentencepiece `
            tools/argos_helper.py

      - name: Smoke test Argos helper
        shell: pwsh
        run: |
          python -c "import subprocess; p=subprocess.Popen([r'dist/SubFlow.ArgosHelper.exe'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,encoding='utf-8'); out,err=p.communicate('{\"type\":\"shutdown\"}\n',timeout=30); print(out); print(err); raise SystemExit(p.returncode)"
          Get-Item dist/SubFlow.ArgosHelper.exe | Select-Object Name,Length

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/NapisyPL/NapisyPL.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts/win-x64
          Copy-Item dist/SubFlow.ArgosHelper.exe artifacts/win-x64/SubFlow.ArgosHelper.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SubFlow-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
