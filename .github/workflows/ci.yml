name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore
        run: dotnet restore NapisyPL.sln

      - name: Test
        run: dotnet test NapisyPL.sln -c Release --no-restore

      - name: Build Argos helper
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "ctranslate2>=4,<5" "sentencepiece>=0.2,<0.3" pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --name SubFlow.ArgosHelper `
            --collect-all ctranslate2 `
            --collect-all sentencepiece `
            tools/argos_helper.py

      - name: Smoke test Argos helper
        shell: pwsh
        run: |
          $output = '{"type":"shutdown"}' | & .\dist\SubFlow.ArgosHelper.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 0) { throw "Argos helper smoke test failed with exit code $exitCode" }
          Get-Item dist/SubFlow.ArgosHelper.exe | Select-Object Name,Length

      - name: Integration test Argos EN to PL
        if: github.ref == 'refs/heads/feature/local-translator-batch-v2'
        shell: pwsh
        run: |
          $modelPath = Join-Path $PWD 'translate-en_pl-1_9.argosmodel'
          Invoke-WebRequest `
            -Uri 'https://data.argosopentech.com/argospm/v1/translate-en_pl-1_9.argosmodel' `
            -OutFile $modelPath
          $jsonModelPath = $modelPath -replace '\\','/'
          $load = @{ type = 'load'; modelPath = $jsonModelPath } | ConvertTo-Json -Compress
          $translate = @{
            type = 'translate'
            jobId = 'smoke'
            segments = @(@{ id = 1; text = 'Hello, how are you?' })
          } | ConvertTo-Json -Depth 5 -Compress
          $shutdown = '{"type":"shutdown"}'
          $output = @($load, $translate, $shutdown) | & .\dist\SubFlow.ArgosHelper.exe 2> argos-smoke.err
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if (Test-Path argos-smoke.err) { Get-Content argos-smoke.err | Write-Host }
          if ($exitCode -ne 0) { throw "Argos integration smoke test failed with exit code $exitCode" }
          $events = @($output | ForEach-Object { $_ | ConvertFrom-Json })
          if ($events | Where-Object { $_.type -eq 'error' }) { throw 'Argos helper returned an error event.' }
          if (-not ($events | Where-Object { $_.type -eq 'ready' })) { throw 'Argos helper did not emit ready.' }
          $segment = $events | Where-Object { $_.type -eq 'segment' -and $_.jobId -eq 'smoke' } | Select-Object -First 1
          if ($null -eq $segment -or [string]::IsNullOrWhiteSpace($segment.text)) { throw 'Argos helper did not return translated text.' }
          Write-Host "Argos smoke translation: $($segment.text)"

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/NapisyPL/NapisyPL.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts/win-x64
          Copy-Item dist/SubFlow.ArgosHelper.exe artifacts/win-x64/SubFlow.ArgosHelper.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SubFlow-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
